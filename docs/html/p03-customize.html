<style>

@font-face{font-family:'Pretendard';src:url('./assets/e1e4e3d781524e0be24d782bd335a8d8.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Pretendard';src:url('./assets/219eaf59f0b4418b78550957d4062202.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Pretendard';src:url('./assets/a59cd8597029c48d8caa4a7b7189ae28.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}

<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #FBF6F0; color: #3D2E28; font-family: Pretendard, 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <!-- P03-S01 상단 바 -->
  <header style="height: 68px; flex: none; background: #FFFFFF; border-bottom: 1px solid #EADFD5; padding: 0 24px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="P02-Detail.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #3D2E28; border-radius: 999px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <a href="M06-Help.dc.html" aria-label="도움말" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #3D2E28; border-radius: 999px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"></path><path d="M12 17h.01"></path></svg>

    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E3D3C7; background: #FFFFFF; color: #3D2E28; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
        되돌리기
      </button>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E3D3C7; background: #FFFFFF; color: #3D2E28; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg>
        다시 실행
      </button>
      <a href="M02-Reset.dc.html" style="text-decoration: none; height: 44px; padding: 0 16px; box-sizing: border-box; border-radius: 999px; border: 1px solid #E3D3C7; background: #FFFFFF; color: #3D2E28; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
        전체 초기화
      </a>
      <a href="P04-Confirm.dc.html" style="text-decoration: none; margin-left: 8px; height: 44px; padding: 0 28px; box-sizing: border-box; border-radius: 999px; background: #C4513F; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; box-shadow: 0 6px 16px rgba(196, 81, 63, 0.25)">완료</a>
    </div>
  </header>

  <!-- P03-S02 편집 영역 -->
  <main style="flex: 1; min-height: 0; position: relative; display: flex">
    <!-- 배율 -->
    <div style="position: absolute; top: 20px; left: 24px; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EADFD5">
      <button type="button" aria-label="축소" style="width: 36px; height: 36px; border-radius: 999px; border: none; background: transparent; color: #3D2E28; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
      <span style="min-width: 48px; text-align: center; font-size: 13px; font-weight: 600; color: #6F5D54">100%</span>
      <button type="button" aria-label="확대" style="width: 36px; height: 36px; border-radius: 999px; border: none; background: transparent; color: #3D2E28; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
      </button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: none; background: #F7E6DF; color: #3D2E28; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">리셋</button>
    </div>

    <!-- 캔버스 -->
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding-right: 120px">
      <div style="position: relative; width: 470px; height: 470px; border-radius: 56px; border: 2px dashed #DDBFB2; padding: 14px; box-sizing: border-box">
        <div style="width: 100%; height: 100%; border-radius: 44px; background: #F3DCD3; box-shadow: 0 18px 40px rgba(196, 81, 63, 0.12); position: relative; display: flex; align-items: center; justify-content: center">
          <span style="position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: #6F5D54">케이스 (뚜껑 윗면)</span>
          <!-- 안쪽 점선: 꾸밀 수 있는 범위 -->
          <div style="position: absolute; inset: 44px; border-radius: 28px; border: 1.5px dashed #C4513F; opacity: 0.55"></div>

          <!-- 드래그 안내 -->
          <div style="position: absolute; top: 96px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: rgba(61, 46, 40, 0.82); color: #FFFFFF; font-size: 14px; font-weight: 600; white-space: nowrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5"></path><path d="M12 10V4a1.5 1.5 0 0 1 3 0v6"></path><path d="M15 10.5V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.4 13a1.5 1.5 0 0 1 2.4-1.8L9 14"></path></svg>
            드래그해주세요
          </div>

          <!-- 큐빅 안내: 큐빅 패널을 처음 열 때 드래그 안내 아래에 4초 -->
          <div role="status" style="position: absolute; top: 148px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-start; gap: 8px; padding: 10px 16px; border-radius: 16px; background: rgba(61, 46, 40, 0.82); color: #FFFFFF; font-size: 14px; font-weight: 600; line-height: 1.5; white-space: nowrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
            <span>큐빅은 하나하나 손으로 붙여 드려요.<br>강한 충격이나 마찰에는 떨어질 수 있어요.</span>
          </div>

          <!-- 선택 상자 예시 (각인 선택 상태) -->
          <div style="position: absolute; top: 236px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border: 1.5px solid #C4513F; border-radius: 6px; background: rgba(255, 255, 255, 0.35)">
            <span style="font-family: 'Noto Serif KR', serif; font-size: 26px; font-weight: 500; letter-spacing: 0.04em; color: #A9824F; white-space: nowrap">각인 입력</span>
            <span style="position: absolute; top: -6px; left: -6px; width: 10px; height: 10px; border-radius: 3px; background: #FFFFFF; border: 1.5px solid #C4513F"></span>
            <span style="position: absolute; top: -6px; right: -6px; width: 10px; height: 10px; border-radius: 3px; background: #FFFFFF; border: 1.5px solid #C4513F"></span>
            <span style="position: absolute; bottom: -6px; left: -6px; width: 10px; height: 10px; border-radius: 3px; background: #FFFFFF; border: 1.5px solid #C4513F"></span>
            <span style="position: absolute; bottom: -6px; right: -6px; width: 10px; height: 10px; border-radius: 3px; background: #FFFFFF; border: 1.5px solid #C4513F"></span>
            <span style="position: absolute; bottom: -34px; left: 50%; width: 1.5px; height: 22px; background: #C4513F"></span>
            <span aria-hidden="true" style="position: absolute; bottom: -46px; left: 50%; margin-left: -7px; width: 14px; height: 14px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #C4513F; box-sizing: border-box"></span>
            <button type="button" aria-label="선택한 스티커 삭제" style="position: absolute; top: -16px; right: -36px; width: 28px; height: 28px; border-radius: 999px; border: none; background: #C4513F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 오른쪽 세로 도구 버튼 5개 (케이스 색 · 큐빅 · 스티커 · 각인 | 케이스 종류) -->
    <nav aria-label="꾸미기 도구" style="position: absolute; top: 50%; right: 28px; transform: translateY(-50%); width: 92px; padding: 10px; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; border: 1px solid #EADFD5; box-shadow: 0 10px 30px rgba(61, 46, 40, 0.06); display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{t.on}}" style="{{t.style}}">
          <sc-if value="{{t.isColor}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.5-.8 1.5-1.5 0-1.2-1-1.5-1-2.5s.8-1.5 1.8-1.5H17a4 4 0 0 0 4-4c0-4.7-4-8.5-9-8.5z"></path><circle cx="7.5" cy="11" r="1"></circle><circle cx="10" cy="7" r="1"></circle><circle cx="15" cy="7.5" r="1"></circle></svg></sc-if>
          <sc-if value="{{t.isGem}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"></path><path d="M2 9h20M12 21L8 9l4-6 4 6z"></path></svg></sc-if>
          <sc-if value="{{t.isRibbon}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10C9 6 4 5 3 7s1 6 5 5l4-2z"></path><path d="M12 10c3-4 8-5 9-3s-1 6-5 5l-4-2z"></path><path d="M11 11l-3 9 2.5-1.5L12 21l1.5-2.5L16 20l-3-9"></path></svg></sc-if>
          <sc-if value="{{t.isPic}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></sc-if>
          <sc-if value="{{t.isText}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg></sc-if>
          <span>{{t.label}}</span>
        </button>
      </sc-for>
      <div style="height: 1px; margin: 4px 6px; background: #EADFD5"></div>
      <button type="button" aria-pressed="false" style="height: 68px; border-radius: 18px; border: none; background: transparent; color: #3D2E28; font: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><circle cx="12" cy="12" r="4"></circle></svg>
        <span>케이스 종류</span>
      </button>
    </nav>
  </main>

  <!-- P03-S03 도구 패널 (큐빅 패널 예시) -->
  <section aria-label="큐빅" style="flex: none; height: 188px; background: #FFFFFF; border-top: 1px solid #EADFD5; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 30px rgba(61, 46, 40, 0.06); padding: 20px 32px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" fill="#E8786E"></path></svg>
      <h2 style="margin: 0; font-size: 16px; font-weight: 800">큐빅</h2>
      <span style="margin-left: 4px; font-size: 14px; font-weight: 600; color: #6F5D54">스티커·큐빅 3/5 · 추가 요금 없음</span>
    </div>
    <div style="display: flex; gap: 16px; overflow-x: auto">
      <sc-for list="{{stickers}}" as="s" hint-placeholder-count="8">
        <button type="button" aria-label="큐빅 {{s.n}}" style="flex: none; width: 104px; height: 104px; border-radius: 20px; border: 1px solid #EADFD5; background: #FBF1EC; color: #6F5D54; font: inherit; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">큐빅 {{s.n}}</button>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'height: 68px; border-radius: 18px; border: none; font: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 0; ';
    const list = [
      { key: 'color', label: '케이스 색' },
      { key: 'gem', label: '큐빅' },
      { key: 'pic', label: '스티커' },
      { key: 'text', label: '각인' }
    ];
    const tools = list.map((t) => {
      const on = t.key === 'gem';
      return {
        label: t.label,
        on: on ? 'true' : 'false',
        isColor: t.key === 'color', isGem: t.key === 'gem', isRibbon: t.key === 'ribbon', isPic: t.key === 'pic', isText: t.key === 'text',
        style: base + (on ? 'background: #F7E6DF; color: #C4513F;' : 'background: transparent; color: #3D2E28;')
      };
    });
    const stickers = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => ({ n }));
    return { tools, stickers };
  }
}
</script>
</body>
