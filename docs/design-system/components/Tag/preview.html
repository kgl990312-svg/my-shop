<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:24px 28px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.t{padding:4px 10px;border-radius:var(--radius-pill);font-size:14px}
.soft{background:var(--bg-soft);color:var(--ink-tag);font-weight:600}
.size{padding:6px 14px;font-size:14px}
.white{background:var(--bg-surface);color:var(--accent);font-weight:700;border:1px solid var(--line)}
.badge{min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<span class="t soft">하트</span>
<span class="t soft size">크기 지름 약 85mm · 높이 약 28mm</span>
<span class="t soft size">15g 쿠션 리필 호환</span>
<span class="t white">예시 후기</span>
<span class="t white">꾸민 예시</span>
<span class="badge">2</span>

</html>
