<!-- @dsCard group="Layout" height=150 subtitle="P02 · P04 · P07 화면 아래 고정 바" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--ink);padding:24px 0 0}
.bar{background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:var(--shadow-bar);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sum{display:flex;align-items:baseline;gap:12px}
.sum span{font-size:16px;color:var(--ink-muted)}
.sum b{font-size:24px;font-weight:800}
.acts{display:flex;gap:12px}
.btn{height:56px;border-radius:999px;font:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box}
.o{min-width:180px;padding:0 28px;border:1.5px solid var(--accent);background:var(--bg-surface);color:var(--accent);font-size:16px;font-weight:700}
.p{min-width:240px;padding:0 32px;border:none;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;box-shadow:var(--shadow-cta)}
</style>
</head>
<body>
<div class="bar">
  <div class="sum"><span>총 금액</span><b>20,500원</b></div>
  <div class="acts"><button class="btn o" type="button">장바구니 담기</button><button class="btn p" type="button">바로 구매하기</button></div>
</div>
<script></script>
</body>
</html>
