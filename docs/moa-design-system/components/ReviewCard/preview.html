<!-- @dsCard group="Content" height=500 subtitle="후기 카드 · 한 줄 줄임 · 호버 때 확대·문구 흐름" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--ink);padding:24px 28px}
.row{display:grid;grid-template-columns:repeat(2,260px);gap:24px}
.card{background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:1/1;position:relative;overflow:hidden}
.photo{position:absolute;inset:0;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:14px;transition:transform .3s ease}
.tag{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:999px;background:var(--bg-surface);color:var(--accent);font-size:14px;font-weight:700}
.card:hover .photo,.card:focus-within .photo,.card.show .photo{transform:scale(1.05)}
.card:hover .full,.card:focus-within .full,.card.show .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px}
.meta{font-size:14px;color:var(--ink-muted)}
.text{margin:0;font-size:16px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--bg-soft);color:var(--ink-tag);font-size:14px;font-weight:600}
.stars{display:flex;gap:2px}
.stars svg{fill:var(--deco-coral)}
.cap{font-size:14px;color:var(--ink-muted);text-align:center}
@media (prefers-reduced-motion: reduce){.photo,</style>
</head>
<body>
<div class="row">
  <div style="display:flex;flex-direction:column;gap:8px">
    <article class="card" tabindex="0">
      <div class="img"><div class="photo" role="img" aria-label="완성 케이스 사진 자리">완성 케이스 사진</div><span class="tag">예시 후기</span></div>
      <div class="body">
        <div class="stars" role="img" aria-label="별점 5점"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></div>
        <span class="meta">○*○ · 2026.11.16</span>
        <p class="text">내 취향대로 직접 디자인할 수 있다는 점이 정말 좋았어요! 하나하나 배치하면서 꾸미는 재미도 있고 완성된 모습도 너무 만족스러워요 ♡</p>
        <span class="kind">둥근 정사각형</span>
      </div>
    </article>
    <span class="cap">평소 (마우스를 올려 보세요)</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <article class="card show">
      <div class="img"><div class="photo" role="img" aria-label="완성 케이스 사진 자리">완성 케이스 사진</div><span class="tag">예시 후기</span></div>
      <div class="body">
        <span class="meta">○*○ · 2026.11.16</span>
        <p class="text">내 취향대로 직접 디자인할 수 있다는 점이 정말 좋았어요! 하나하나 배치하면서 꾸미는 재미도 있고 완성된 모습도 너무 만족스러워요 ♡</p>
        <span class="kind">둥근 정사각형</span>
      </div>
    </article>
    <span class="cap">호버 상태: 사진 1.05배 확대 (문구는 옆으로 흐름, 별점 생략)</span>
  </div>
</div>

</body>
</html>
