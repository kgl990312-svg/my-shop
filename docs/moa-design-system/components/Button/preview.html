<!-- @dsCard group="Actions" height=230 subtitle="핵심 · 테두리 · 연한 면 · 작은 · 아이콘" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--ink);padding:24px 28px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:inherit;cursor:pointer;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;text-decoration:none}
.primary{height:56px;min-width:240px;padding:0 32px;border:none;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;box-shadow:var(--shadow-cta)}
.outline{height:56px;min-width:180px;padding:0 28px;border:1.5px solid var(--accent);background:var(--bg-surface);color:var(--accent);font-size:16px;font-weight:700}
.soft{height:54px;min-width:160px;padding:0 24px;border:none;background:var(--bg-soft);color:var(--ink);font-size:16px;font-weight:700}
.dark{height:54px;min-width:160px;padding:0 24px;border:none;background:var(--ink);color:var(--on-accent);font-size:16px;font-weight:700}
.small{height:44px;padding:0 16px;border:1px solid var(--line-strong);background:var(--bg-surface);color:var(--ink);font-size:14px;font-weight:600}
.icon{width:48px;height:48px;padding:0;border:1.5px solid var(--line-strong);background:var(--bg-surface);color:var(--ink)}
.cap{font-size:14px;color:var(--ink-muted)}
</style>
</head>
<body>
<div class="row">
  <button class="btn primary" type="button">바로 구매하기</button>
  <button class="btn outline" type="button">장바구니 담기</button>
</div>
<div class="row">
  <button class="btn soft" type="button">취소</button>
  <button class="btn dark" type="button">닫기</button>
  <button class="btn small" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>되돌리기</button>
  <button class="btn icon" type="button" aria-label="다음 후기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
<div class="cap">핵심 56px · 테두리 56px · 안내창 54px · 작은 44px · 아이콘 48px — 모두 알약 모양</div>
<script></script>
</body>
</html>
